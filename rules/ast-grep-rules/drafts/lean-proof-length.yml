id: rule-lean-proof-length
language: Lean
severity: warning
message: "Runaway proof script exceeds 500 lines: extract intermediate lemmas"
note: |
  Monolithic proof scripts exceeding 500 lines indicate a failure to decompose the proof into
  reusable intermediate lemmas (the FLT runaway script anti-pattern). Long proof scripts cause
  severe compiler heartbeat inflation, memory exhaustion, and prevent parallel kernel checking.
  Refactor by decomposing into <= 3-step lemma hierarchies, extracting structural sub-goals into
  standalone lemmas.
rule:
  all:
    - regex: "(?s)(theorem|lemma)\\s+[A-Za-z0-9_.]+\\b.*?\\bby\\b(?:[^\n]*\n){500,}"
metadata:
  category: complexity
  weight: 75
tags:
  - lean
  - complexity
  - flt-anti-pattern
