id: rule-lean-multipackage-tier-dag-integrity
language: Lean
severity: error
message: "Sideways or inverted import between parallel Lean 4 packages violates DAG modularity"
note: |
  The subpackage architecture under `packages/` enforces a strict 4-tier DAG:
    - Tier 0: tacit-foundations (Foundations)
    - Tier 1: stochastic-ccv, cusp-catastrophe, phase-portrait
    - Tier 2: reinforcement-learning (ReinforcementLearning)
    - Tier 3: agentic-safety, provenance-chain
  In addition to vertical DAG hierarchy, horizontal (sideways) imports between
  parallel peer packages within Tier 1 and Tier 3 are strictly prohibited:
    - Tier 1 packages (StochasticCCV, CuspCatastrophe, PhasePortrait) cannot import each other.
    - Tier 3 packages (AgenticSafety, ProvenanceChain) cannot import each other.
  Peer packages must communicate solely via shared abstractions in Tier 0 or Tier 2.
rule:
  any:
    # Tier 1 sideways: StochasticCCV importing CuspCatastrophe or PhasePortrait
    - all:
        - regex: "(?m)^\\s*(?:--\\s*(?:\\[?tier\\s*1\\]?|module\\s+StochasticCCV)|namespace\\s+StochasticCCV\\b)"
        - regex: "(?m)^\\s*import\\s+(?:[A-Za-z0-9_.]+\\s+)*(?:CuspCatastrophe|PhasePortrait)\\b"
    # Tier 1 sideways: CuspCatastrophe importing StochasticCCV or PhasePortrait
    - all:
        - regex: "(?m)^\\s*(?:--\\s*(?:\\[?tier\\s*1\\]?|module\\s+CuspCatastrophe)|namespace\\s+CuspCatastrophe\\b)"
        - regex: "(?m)^\\s*import\\s+(?:[A-Za-z0-9_.]+\\s+)*(?:StochasticCCV|PhasePortrait)\\b"
    # Tier 1 sideways: PhasePortrait importing StochasticCCV or CuspCatastrophe
    - all:
        - regex: "(?m)^\\s*(?:--\\s*(?:\\[?tier\\s*1\\]?|module\\s+PhasePortrait)|namespace\\s+PhasePortrait\\b)"
        - regex: "(?m)^\\s*import\\s+(?:[A-Za-z0-9_.]+\\s+)*(?:StochasticCCV|CuspCatastrophe)\\b"
    # Tier 3 sideways: AgenticSafety importing ProvenanceChain
    - all:
        - regex: "(?m)^\\s*(?:--\\s*(?:\\[?tier\\s*3\\]?|module\\s+AgenticSafety)|namespace\\s+AgenticSafety\\b)"
        - regex: "(?m)^\\s*import\\s+(?:[A-Za-z0-9_.]+\\s+)*ProvenanceChain\\b"
    # Tier 3 sideways: ProvenanceChain importing AgenticSafety
    - all:
        - regex: "(?m)^\\s*(?:--\\s*(?:\\[?tier\\s*3\\]?|module\\s+ProvenanceChain)|namespace\\s+ProvenanceChain\\b)"
        - regex: "(?m)^\\s*import\\s+(?:[A-Za-z0-9_.]+\\s+)*AgenticSafety\\b"
fix: ""
metadata:
  category: correctness
  weight: 95
tags:
  - lean
  - dag-invariants
  - architecture
  - tier-integrity
  - sideways-isolation
