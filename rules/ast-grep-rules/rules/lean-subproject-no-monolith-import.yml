id: rule-lean-subproject-no-monolith-import
language: Lean
severity: error
message: "Subpackage illegally imports monolith module EASCI: use local subpackage or Foundations imports"
note: |
  Subpackages under `packages/` must remain strictly decoupled from the monolithic `EASCI` package.
  Directly importing `EASCI` or any of its submodules (`EASCI.*`) creates circular dependencies,
  breaks standalone Lake builds, and violates modular tier isolation.
  - For foundational mathematics, import from `Foundations.*` (Tier 0 `tacit-foundations`).
  - For tactics, import local package `Tactics` or Mathlib tactics.
  - For cross-subpackage features, import target packages directly according to the 4-tier DAG.
rule:
  any:
    - regex: "(?m)^\\s*import\\s+EASCI\\b"
    - regex: "(?m)^\\s*import\\s+(?:[A-Za-z0-9_.]+\\s+)*EASCI(?:\\.[A-Za-z0-9_]+)*\\b"
fix: ""
metadata:
  category: correctness
  weight: 100
tags:
  - lean
  - modularity
  - architecture
  - tier-integrity
