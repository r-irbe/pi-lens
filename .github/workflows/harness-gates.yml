name: harness-gates

# Generated by harness-bridge ci generate.
# Local: act push -W .github/workflows/harness-gates.yml -j gates
# GitHub: the subset the policy marks as attested.
# Each step is one policy stage and carries its terms: a declared
# budget becomes timeout-minutes, an advisory stage continue-on-error.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the bridge
        env:
          BRIDGE: node packages/pi-harness-bridge/bin/harness-bridge.mjs
        run: |
          if [ ! -f packages/pi-harness-bridge/bin/harness-bridge.mjs ]; then
            echo "the bridge is not vendored at packages/pi-harness-bridge"
            echo "vendor it, or set BRIDGE in the policy, before gates can run"
            exit 1
          fi
          node --version
      - name: SDLC policy gates
        timeout-minutes: 2
        env:
          BRIDGE: node packages/pi-harness-bridge/bin/harness-bridge.mjs
        run: |
          status=0
          $BRIDGE process status || status=$?
          if [ "$status" = "77" ]; then
            echo "skipped: the stage reported that it does not apply here"
            exit 0
          fi
          exit $status
      - name: Unicode policy (scoped)
        timeout-minutes: 10
        continue-on-error: true
        env:
          BRIDGE: node packages/pi-harness-bridge/bin/harness-bridge.mjs
        run: |
          status=0
          $BRIDGE policy unicode . || status=$?
          if [ "$status" = "77" ]; then
            echo "skipped: the stage reported that it does not apply here"
            exit 0
          fi
          exit $status

  # The repository's own verifier, kept separate so a slow ladder does not
  # hide the cheap failures, and so it can be required by a branch rule
  # without requiring the whole workflow.
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Full verification ladder
        timeout-minutes: 45
        run: |
          status=0
          bash scripts/verify_ui.sh || status=$?
          if [ "$status" = "77" ]; then
            echo "skipped: the stage reported that it does not apply here"
            exit 0
          fi
          exit $status
